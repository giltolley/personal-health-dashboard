name: Validate v0.7 dashboard

on:
  pull_request:
    paths:
      - 'dashboard_v07.py'
      - 'test_dashboard_v07.py'
      - 'test_streamlit_v07_smoke.py'
      - 'app.py'
      - 'insights_v06.py'
      - 'requirements.txt'
      - '.github/workflows/test-dashboard-v07.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dashboard dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile modified Python files
        run: python -m py_compile app.py insights_v06.py dashboard_v07.py
      - name: Run analytics regression suites
        run: python -m unittest -v test_dashboard_v07 test_insights_v06 test_garmin_activity_filter
      - name: Render all Streamlit tabs with synthetic SQLite data
        run: python -m unittest -v test_streamlit_v07_smoke
