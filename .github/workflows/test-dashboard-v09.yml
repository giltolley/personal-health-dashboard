name: Validate energy explorer and 5/3/1 planner

on:
  pull_request:
    paths:
      - 'app.py'
      - 'dashboard_v09.py'
      - 'test_dashboard_v09.py'
      - 'test_streamlit_v07_smoke.py'
      - '.github/workflows/test-dashboard-v09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile dashboard
        run: python -m py_compile app.py dashboard_v07.py dashboard_v08.py dashboard_v09.py
      - name: Test energy and 5/3/1 math
        run: python -m unittest -v test_dashboard_v09 test_dashboard_v08 test_dashboard_v07 test_insights_v06 test_garmin_activity_filter
      - name: Render app with synthetic health and training measurements
        run: python -m unittest -v test_streamlit_v07_smoke
