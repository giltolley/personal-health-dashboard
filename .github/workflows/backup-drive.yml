name: Daily encrypted Drive backup
on:
  schedule:
    - cron: '47 5 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-health-dashboard-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.ENABLE_DRIVE_BACKUPS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-health-connect.txt
            requirements-backup.txt
      - run: python -m pip install -r requirements-backup.txt
      - name: Export, restore-check, encrypt, upload and verify
        run: python backup_drive.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DRIVE_AUTH_JSON: ${{ secrets.BACKUP_DRIVE_AUTH_JSON }}
          BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
