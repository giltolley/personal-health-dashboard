name: Hevy scheduled sync
on:
  schedule:
    - cron: '31 10,22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: health-dashboard-hevy-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # Verify that Supabase is configured
      - name: Verify PostgreSQL configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ "$DATABASE_URL" != postgresql://* && "$DATABASE_URL" != postgres://* ]]; then
            echo "::error::DATABASE_URL is missing or invalid"
            exit 1
          fi
      
      - run: python sync_all.py --hevy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
