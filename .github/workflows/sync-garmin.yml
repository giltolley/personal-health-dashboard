name: Garmin scheduled sync

on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-dashboard-garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Verify that Supabase is configured
      - name: Verify PostgreSQL configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ "$DATABASE_URL" != postgresql://* && "$DATABASE_URL" != postgres://* ]]; then
            echo "::error::DATABASE_URL is missing or invalid"
            exit 1
          fi

      # Synchronize Garmin data
      - name: Sync Garmin
        run: python sync_all.py --garmin --days 14
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
